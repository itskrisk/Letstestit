<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUNCHEEZ_APP_TOUR_50S</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #4A90E2;
            --gold: #D4AF37;
            --green: #00A082;
            --black: #000000;
            --white: #ffffff;
            --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: var(--black); 
            font-family: 'Outfit', sans-serif;
            color: var(--white);
            -webkit-font-smoothing: antialiased;
        }

        #ad-canvas {
            width: 100vw; height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }

        .text-hero {
            font-size: clamp(3rem, 10vmin, 8rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            text-align: center;
            position: absolute;
        }

        /* ─── UI Component Styles (Glassmorphism) ─── */
        .ui-glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        /* Scene: Search */
        #search-bar {
            width: 60vw;
            max-width: 800px;
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            font-size: 2rem;
            color: rgba(255,255,255,0.9);
            position: absolute;
            transform: scale(0.9);
        }
        .cursor-blink {
            width: 3px; height: 40px; background: var(--blue);
            margin-left: 10px; animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Scene: App Card */
        #restaurant-card {
            width: 400px; height: 550px;
            display: flex; flex-direction: column;
            padding: 20px; position: absolute;
        }
        .card-img { width: 100%; height: 250px; border-radius: 16px; background: #222; object-fit: cover; }
        .card-title { font-size: 1.8rem; font-weight: 700; margin-top: 20px; }
        .card-sub { font-size: 1rem; opacity: 0.6; margin-top: 5px; }
        .card-btn {
            margin-top: auto; height: 60px; width: 100%;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 700;
            background: var(--blue); color: white;
            transition: all 0.3s;
            overflow: hidden; position: relative;
        }

        /* Scene: Map Tracking */
        #map-pin {
            width: 40px; height: 40px; background: var(--green); border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg); position: absolute;
            box-shadow: -5px 5px 20px rgba(0,160,130,0.5);
        }
        .pulse-ring {
            width: 100px; height: 100px; border: 2px solid var(--green); border-radius: 50%;
            position: absolute; animation: pulse-out 2s infinite; opacity: 0;
        }
        @keyframes pulse-out { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

        /* ─── Controls (100% Stealth) ─── */
        #controls-hot-zone {
            position: fixed; bottom: 0; right: 0; width: 400px; height: 150px; z-index: 4000;
            display: flex; align-items: flex-end; justify-content: flex-end; padding: 30px;
        }
        #controls {
            display: flex; gap: 15px; opacity: 0; transform: translateY(20px);
            transition: all 0.4s var(--ease-apple); pointer-events: none;
        }
        #controls-hot-zone:hover #controls { opacity: 1; transform: translateY(0); pointer-events: all; }
        .control-btn {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); color: white;
            padding: 12px 24px; border-radius: 100px; cursor: pointer;
            font-family: inherit; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }
        .control-btn:hover { background: white; color: black; }

        #start-prompt {
            position: fixed; inset: 0; z-index: 2000; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #start-prompt.hide { opacity: 0; pointer-events: none; visibility: hidden; }
        .play-icon { font-size: 3rem; margin-bottom: 2rem; color: #fff; cursor: pointer; }

        body.recording { cursor: none !important; }
        body.recording #controls-hot-zone { display: none !important; }
    </style>
</head>
<body id="main-body">

    <div id="start-prompt" class="hide">
        <div class="play-icon" id="play-btn" onclick="handleStartTrigger()">▶</div>
        <div style="font-size: 0.8rem; letter-spacing: 0.5em; color: #888; text-transform: uppercase;" id="prompt-label">50s UI Simulation</div>
        <div style="margin-top: 1rem; font-size: 0.6rem; opacity: 0.4; letter-spacing: 0.1em;">CLICK PLAY OR PRESS SPACE</div>
    </div>

    <div id="ad-canvas">
        <!-- Scene 1: Intro (0-10s) -->
        <div class="layer" id="scene-intro">
            <h1 class="text-hero" id="i-text-1">Your Cravings.</h1>
            <h1 class="text-hero" id="i-text-2" style="color: var(--blue);">Solved.</h1>
        </div>

        <!-- Scene 2: Search UI (10-22s) -->
        <div class="layer" id="scene-search">
            <h2 style="position: absolute; top: 20vh; font-size: 2rem; opacity: 0.5; letter-spacing: 0.2em;">FIND ANYTHING</h2>
            <div class="ui-glass" id="search-bar">
                <span style="opacity: 0.4; margin-right: 20px;">🔍</span>
                <span id="typewriter"></span><span class="cursor-blink"></span>
            </div>
        </div>

        <!-- Scene 3: Card UI (22-35s) -->
        <div class="layer" id="scene-card">
            <div class="ui-glass" id="restaurant-card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800" class="card-img" id="c-img">
                <div class="card-title" id="c-title">The Artisan Burger</div>
                <div class="card-sub" id="c-sub">Nairobi CBD • 15-20 min</div>
                <div class="card-btn" id="c-btn"><span id="c-btn-txt">Add to Cart</span></div>
            </div>
        </div>

        <!-- Scene 4: Tracking (35-43s) -->
        <div class="layer" id="scene-map">
            <div style="position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, rgba(0,160,130,0.1) 0%, transparent 70%);"></div>
            <div class="pulse-ring"></div>
            <div id="map-pin"></div>
            <h1 class="text-hero" id="map-text" style="bottom: 15vh; font-size: 4rem;">On its way.</h1>
        </div>

        <!-- Scene 5: Final (43-50s) -->
        <div class="layer" id="scene-final">
            <h1 class="text-hero" id="f-logo" style="font-size: 10vw;">Muncheez<span style="color:var(--blue)">.</span></h1>
            <div id="f-dl" class="ui-glass" style="margin-top: 25vh; padding: 20px 50px; font-size: 1.5rem; font-weight: 700;">Get the App</div>
        </div>
    </div>

    <div id="controls-hot-zone">
        <div id="controls">
            <button class="control-btn" onclick="tl.restart()">↺ Replay</button>
            <button class="control-btn" id="record-btn" onclick="prepareRecord()">🎥 Record Tab</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
    <script>
        gsap.registerPlugin(TextPlugin);
        let mediaRecorder;
        let isRecordMode = false;
        
        const tl = gsap.timeline({ 
            paused: true,
            onComplete: () => { if (mediaRecorder && mediaRecorder.state === 'recording') setTimeout(() => mediaRecorder.stop(), 1000); }
        });

        function handleStartTrigger() {
            if (isRecordMode) {
                document.getElementById('main-body').classList.add('recording');
                if (mediaRecorder) mediaRecorder.start();
                setTimeout(() => { document.getElementById('start-prompt').classList.add('hide'); tl.restart(); }, 400);
            } else {
                document.getElementById('start-prompt').classList.add('hide');
                tl.play();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !document.getElementById('start-prompt').classList.contains('hide')) {
                e.preventDefault(); handleStartTrigger();
            }
        });

        function init() {
            // EXACTLY 50 SECONDS
            // Scene 1: Intro (0-10s)
            tl.set("#scene-intro", { opacity: 1, visibility: "visible" }, 0);
            tl.fromTo("#i-text-1", { opacity: 0, scale: 0.8, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 2, ease: "power3.out" }, 1);
            tl.to("#i-text-1", { opacity: 0, scale: 1.1, filter: "blur(10px)", duration: 1 }, 4);
            tl.fromTo("#i-text-2", { opacity: 0, y: 50, filter: "blur(20px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 2, ease: "back.out(1.5)" }, 5);
            tl.to("#scene-intro", { opacity: 0, scale: 1.5, filter: "blur(30px)", duration: 1.5, ease: "power2.in" }, 8.5);

            // Scene 2: Search (10-22s)
            tl.set("#scene-search", { opacity: 1, visibility: "visible" }, 10);
            tl.fromTo("#search-bar", { opacity: 0, y: 100, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 1.5, ease: "back.out(1.2)" }, 10.5);
            tl.to("#typewriter", { text: "Nairobi's Best Burgers...", duration: 3, ease: "none" }, 13);
            tl.to("#search-bar", { scale: 1.05, boxShadow: "0 40px 80px rgba(74, 144, 226, 0.4)", duration: 0.5, ease: "power2.out" }, 17);
            tl.to("#scene-search", { opacity: 0, y: -100, duration: 1, ease: "power2.in" }, 21);

            // Scene 3: Card (22-35s)
            tl.set("#scene-card", { opacity: 1, visibility: "visible" }, 22);
            tl.fromTo("#restaurant-card", { opacity: 0, y: 200, rotationX: 45, transformPerspective: 1000 }, { opacity: 1, y: 0, rotationX: 0, duration: 2, ease: "power4.out" }, 22.5);
            tl.fromTo(["#c-img", "#c-title", "#c-sub", "#c-btn"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 1, stagger: 0.2, ease: "power2.out" }, 23.5);
            
            // Simulate Click
            tl.to("#c-btn", { scale: 0.95, duration: 0.1 }, 28);
            tl.to("#c-btn", { scale: 1, backgroundColor: "var(--green)", duration: 0.3 }, 28.1);
            tl.to("#c-btn-txt", { text: "Order Confirmed ✓", duration: 0.2 }, 28.1);
            tl.to("#restaurant-card", { opacity: 0, scale: 0.8, filter: "blur(20px)", duration: 1.5, ease: "power3.in" }, 33.5);

            // Scene 4: Map (35-43s)
            tl.set("#scene-map", { opacity: 1, visibility: "visible" }, 35);
            tl.fromTo("#map-pin", { y: -200, opacity: 0 }, { y: 0, opacity: 1, duration: 1, ease: "bounce.out" }, 35.5);
            tl.fromTo("#map-text", { opacity: 0, letterSpacing: "0.2em" }, { opacity: 1, letterSpacing: "-0.04em", duration: 2, ease: "power2.out" }, 37);
            tl.to("#scene-map", { opacity: 0, duration: 1 }, 42);

            // Scene 5: Final (43-50s)
            tl.set("#scene-final", { opacity: 1, visibility: "visible" }, 43);
            tl.fromTo("#f-logo", { opacity: 0, scale: 0.5, filter: "blur(40px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 2.5, ease: "expo.out" }, 43.5);
            tl.fromTo("#f-dl", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1.5, ease: "back.out(1.5)" }, 45);
            tl.play();
        }

        async function prepareRecord() {
            try {
                // THE FIX: Adding displaySurface: 'browser' forces Chrome to prioritize tab selection
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { 
                        displaySurface: "browser",
                        frameRate: 60, 
                        cursor: "never" 
                    },
                    preferCurrentTab: true,
                    audio: false
                });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
                let chunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
                    a.download = 'muncheez-app-tour-50s.webm';
                    a.click();
                    
                    isRecordMode = false;
                    document.getElementById('main-body').classList.remove('recording');
                    document.getElementById('start-prompt').classList.remove('hide');
                    document.getElementById('prompt-label').innerText = '50s UI Simulation';
                    document.getElementById('play-btn').innerText = '▶';
                    tl.progress(0).pause();
                    stream.getTracks().forEach(t => t.stop());
                };
                
                isRecordMode = true;
                document.getElementById('start-prompt').classList.remove('hide');
                document.getElementById('prompt-label').innerText = 'READY: PRESS SPACEBAR';
                document.getElementById('play-btn').innerText = '⏺';
            } catch (err) { alert("Recording preparation cancelled."); }
        }

        window.onload = init;
    </script>
</body>
</html>
