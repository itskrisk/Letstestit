<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUNCHEEZ_APP_TOUR_25S</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #4A90E2;
            --gold: #D4AF37;
            --green: #00A082;
            --black: #000000;
            --white: #ffffff;
            --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: var(--black); 
            font-family: 'Outfit', sans-serif;
            color: var(--white);
            -webkit-font-smoothing: antialiased;
        }

        #ad-canvas {
            width: 100vw; height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }

        .text-hero {
            font-size: clamp(3rem, 12vmin, 9rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            text-align: center;
            position: absolute;
        }

        /* ─── UI Component Styles (Glassmorphism) ─── */
        .ui-glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        /* Scene: Quick Swipe */
        .food-card {
            width: 300px; height: 400px; position: absolute;
            display: flex; flex-direction: column; padding: 15px;
        }
        .fc-img { width: 100%; height: 200px; border-radius: 16px; background: #222; object-fit: cover; }
        .fc-title { font-size: 1.5rem; font-weight: 700; margin-top: 15px; }

        /* Scene: Notification */
        #notification {
            width: 400px; height: 100px; position: absolute; top: 10vh;
            display: flex; align-items: center; padding: 0 20px;
        }
        .notif-icon { width: 50px; height: 50px; background: var(--green); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .notif-text { margin-left: 20px; font-weight: 600; font-size: 1.2rem; }

        /* ─── Controls (100% Stealth) ─── */
        #controls-hot-zone {
            position: fixed; bottom: 0; right: 0; width: 400px; height: 150px; z-index: 4000;
            display: flex; align-items: flex-end; justify-content: flex-end; padding: 30px;
        }
        #controls {
            display: flex; gap: 15px; opacity: 0; transform: translateY(20px);
            transition: all 0.4s var(--ease-apple); pointer-events: none;
        }
        #controls-hot-zone:hover #controls { opacity: 1; transform: translateY(0); pointer-events: all; }
        .control-btn {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2); color: white;
            padding: 12px 24px; border-radius: 100px; cursor: pointer;
            font-family: inherit; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }
        .control-btn:hover { background: white; color: black; }

        #start-prompt {
            position: fixed; inset: 0; z-index: 2000; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #start-prompt.hide { opacity: 0; pointer-events: none; visibility: hidden; }
        .play-icon { font-size: 3rem; margin-bottom: 2rem; color: #fff; cursor: pointer; }

        body.recording { cursor: none !important; }
        body.recording #controls-hot-zone { display: none !important; }
    </style>
</head>
<body id="main-body">

    <div id="start-prompt" class="hide">
        <div class="play-icon" id="play-btn" onclick="handleStartTrigger()">▶</div>
        <div style="font-size: 0.8rem; letter-spacing: 0.5em; color: #888; text-transform: uppercase;" id="prompt-label">25s Fast Promo</div>
        <div style="margin-top: 1rem; font-size: 0.6rem; opacity: 0.4; letter-spacing: 0.1em;">CLICK PLAY OR PRESS SPACE</div>
    </div>

    <div id="ad-canvas">
        <!-- Scene 1: Intro (0-5s) -->
        <div class="layer" id="scene-intro">
            <h1 class="text-hero" id="i-text-1">Hungry?</h1>
            <h1 class="text-hero" id="i-text-2" style="color: var(--gold);">Tap.</h1>
        </div>

        <!-- Scene 2: Rapid Swipe (5-12s) -->
        <div class="layer" id="scene-swipe">
            <div class="ui-glass food-card" id="card-1" style="z-index: 1;">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=800" class="fc-img">
                <div class="fc-title">Pizza</div>
            </div>
            <div class="ui-glass food-card" id="card-2" style="z-index: 2;">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=800" class="fc-img">
                <div class="fc-title">Salads</div>
            </div>
            <div class="ui-glass food-card" id="card-3" style="z-index: 3;">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800" class="fc-img">
                <div class="fc-title" style="color: var(--blue);">Burger (Selected)</div>
            </div>
        </div>

        <!-- Scene 3: Notification (12-18s) -->
        <div class="layer" id="scene-notif">
            <div class="ui-glass" id="notification">
                <div class="notif-icon">🛵</div>
                <div class="notif-text">Driver Arriving!</div>
            </div>
            <h1 class="text-hero" id="n-text" style="font-size: 6vw;">Delivered in Minutes.</h1>
        </div>

        <!-- Scene 4: Final (18-25s) -->
        <div class="layer" id="scene-final">
            <h1 class="text-hero" id="f-logo" style="font-size: 10vw;">Muncheez<span style="color:var(--blue)">.</span></h1>
            <div id="f-dl" class="ui-glass" style="margin-top: 25vh; padding: 15px 40px; font-size: 1.2rem; font-weight: 700;">Download Now</div>
        </div>
    </div>

    <div id="controls-hot-zone">
        <div id="controls">
            <button class="control-btn" onclick="tl.restart()">↺ Replay</button>
            <button class="control-btn" id="record-btn" onclick="prepareRecord()">🎥 Record Tab</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        let mediaRecorder;
        let isRecordMode = false;
        
        const tl = gsap.timeline({ 
            paused: true,
            onComplete: () => { if (mediaRecorder && mediaRecorder.state === 'recording') setTimeout(() => mediaRecorder.stop(), 1000); }
        });

        function handleStartTrigger() {
            if (isRecordMode) {
                document.getElementById('main-body').classList.add('recording');
                if (mediaRecorder) mediaRecorder.start();
                setTimeout(() => { document.getElementById('start-prompt').classList.add('hide'); tl.restart(); }, 400);
            } else {
                document.getElementById('start-prompt').classList.add('hide');
                tl.play();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !document.getElementById('start-prompt').classList.contains('hide')) {
                e.preventDefault(); handleStartTrigger();
            }
        });

        function init() {
            // EXACTLY 25 SECONDS
            // Scene 1: Intro (0-5s)
            tl.set("#scene-intro", { opacity: 1, visibility: "visible" }, 0);
            tl.fromTo("#i-text-1", { opacity: 0, scale: 0.8, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.5, ease: "power3.out" }, 0.5);
            tl.to("#i-text-1", { opacity: 0, scale: 1.1, filter: "blur(10px)", duration: 0.8 }, 2.5);
            tl.fromTo("#i-text-2", { opacity: 0, y: 50, filter: "blur(20px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.5, ease: "back.out(1.5)" }, 3);
            tl.to("#scene-intro", { opacity: 0, scale: 1.5, filter: "blur(30px)", duration: 1, ease: "power2.in" }, 4.5);

            // Scene 2: Swipe Cards (5-12s)
            tl.set("#scene-swipe", { opacity: 1, visibility: "visible" }, 5);
            tl.fromTo("#card-1", { opacity: 0, x: -300, rotation: -20 }, { opacity: 1, x: 0, rotation: 0, duration: 1, ease: "power3.out" }, 5.5);
            tl.fromTo("#card-2", { opacity: 0, x: -300, rotation: -20 }, { opacity: 1, x: 0, rotation: 0, duration: 1, ease: "power3.out" }, 6.5);
            tl.fromTo("#card-3", { opacity: 0, x: -300, rotation: -20 }, { opacity: 1, x: 0, rotation: 0, duration: 1, ease: "power3.out" }, 7.5);
            
            // "Select" Card 3
            tl.to("#card-3", { scale: 1.1, boxShadow: "0 40px 80px rgba(74, 144, 226, 0.4)", duration: 0.5, ease: "power2.out" }, 9);
            tl.to(["#card-1", "#card-2"], { opacity: 0, x: 300, duration: 0.8, stagger: 0.2, ease: "power2.in" }, 9.5);
            tl.to("#card-3", { opacity: 0, scale: 1.5, filter: "blur(20px)", duration: 1, ease: "power3.in" }, 11);
            tl.to("#scene-swipe", { opacity: 0 }, 12);

            // Scene 3: Notification (12-18s)
            tl.set("#scene-notif", { opacity: 1, visibility: "visible" }, 12);
            tl.fromTo("#notification", { y: -150, opacity: 0 }, { y: 0, opacity: 1, duration: 1.5, ease: "elastic.out(1, 0.5)" }, 12.5);
            tl.fromTo("#n-text", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1.5, ease: "power3.out" }, 14);
            tl.to("#scene-notif", { opacity: 0, filter: "blur(20px)", duration: 1 }, 17);

            // Scene 4: Final (18-25s)
            tl.set("#scene-final", { opacity: 1, visibility: "visible" }, 18);
            tl.fromTo("#f-logo", { opacity: 0, scale: 0.5, filter: "blur(40px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 2, ease: "expo.out" }, 18.5);
            tl.fromTo("#f-dl", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 1.5, ease: "back.out(1.5)" }, 20);
            tl.play();
        }

        async function prepareRecord() {
            try {
                // THE FIX: displaySurface: 'browser' prioritizes the current Chrome tab
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { 
                        displaySurface: "browser",
                        frameRate: 60, 
                        cursor: "never" 
                    },
                    preferCurrentTab: true,
                    audio: false
                });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
                let chunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
                    a.download = 'muncheez-app-tour-25s.webm';
                    a.click();
                    
                    isRecordMode = false;
                    document.getElementById('main-body').classList.remove('recording');
                    document.getElementById('start-prompt').classList.remove('hide');
                    document.getElementById('prompt-label').innerText = '25s Fast Promo';
                    document.getElementById('play-btn').innerText = '▶';
                    tl.progress(0).pause();
                    stream.getTracks().forEach(t => t.stop());
                };
                
                isRecordMode = true;
                document.getElementById('start-prompt').classList.remove('hide');
                document.getElementById('prompt-label').innerText = 'READY: PRESS SPACEBAR';
                document.getElementById('play-btn').innerText = '⏺';
            } catch (err) { alert("Recording preparation cancelled."); }
        }

        window.onload = init;
    </script>
</body>
</html>
